# dsh-plugin-ponytail bundle patch — one mount:
# the plugin registers the six slash commands AND a filesystem skill provider
# rooted at this bundle's skills/ directory. The provider registers into the
# skill registry's global (deployment) layer, so every agent/preset sees the
# skills even though the web profile disables the host skill-filesystem row.
- insert:
    - id: dsh-plugin-ponytail
      name: 'dsh-plugin-ponytail'
